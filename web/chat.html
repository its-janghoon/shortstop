<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask · AI chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      /* A made-up AI chat page for the demo video. Not a real product; the reply is canned. */
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; background: #f7f6f2; color: #1f1f1c; height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
      html.demo, html.demo * { cursor: none !important; }
      aside { background: #ecebe5; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
      aside h1 { margin: 0 0 18px; font-size: 21px; display: flex; gap: 10px; align-items: center; }
      aside h1 i { width: 28px; height: 28px; border-radius: 50%; background: #e0773c; display: inline-block; }
      aside .new { background: #fff; border-radius: 10px; padding: 10px 12px; font-weight: 700; margin-bottom: 14px; }
      aside span { padding: 8px 12px; border-radius: 8px; color: #55544e; }
      main { display: grid; grid-template-rows: 1fr auto; height: 100vh; }
      .log { overflow: auto; padding: 48px 0 20px; }
      .col { max-width: 820px; margin: 0 auto; padding: 0 28px; display: flex; flex-direction: column; gap: 18px; }
      .hello { margin: 18vh auto 0; text-align: center; font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
      .me { align-self: flex-end; max-width: 80%; background: #e7e4da; border-radius: 18px 18px 4px 18px; padding: 14px 18px; font-size: 17px; line-height: 1.6; white-space: pre-wrap; }
      .bot { font-size: 17px; line-height: 1.65; }
      .me code, .bot code { background: #1f1f1c; color: #f7f6f2; border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: 14px; font-family: inherit; }
      .dots { display: inline-flex; gap: 5px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: #9b998f; animation: b 1s infinite; }
      .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes b { 50% { transform: translateY(-5px); opacity: .5; } }
      form { padding: 18px 28px 30px; }
      .box { max-width: 820px; margin: 0 auto; background: #fff; border: 1.5px solid #dcd9cf; border-radius: 22px; padding: 14px 16px 12px; box-shadow: 0 6px 22px rgba(0,0,0,.06); }
      textarea { width: 100%; border: 0; outline: 0; resize: none; font: inherit; font-size: 17px; line-height: 1.55; min-height: 96px; background: transparent; }
      .row { display: flex; justify-content: space-between; align-items: center; color: #8a887f; font-size: 13.5px; }
      button { border: 0; background: #1f1f1c; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; font-weight: 800; }
    </style>
  </head>
  <body>
    <aside>
      <h1><i></i>Ask</h1>
      <div class="new">+ New chat</div>
      <span>Trip ideas for March</span><span>Email to the landlord</span><span>Fix my spreadsheet</span>
    </aside>
    <main>
      <div class="log"><div class="col" id="col"><div class="hello">How can I help, John?</div></div></div>
      <form id="f"><div class="box"><textarea id="t" placeholder="Message Ask"></textarea><div class="row"><span>Ask can make mistakes.</span><button type="submit" aria-label="Send">↑</button></div></div></form>
    </main>
    <script>
      if (location.search.includes("demo")) document.documentElement.classList.add("demo");
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      const tok = (s) => esc(s).replace(/\[([A-Z]+_\d+)\]/g, "<code>$1</code>");
      const col = document.getElementById("col");
      const t = document.getElementById("t");
      function send(e) {
        e?.preventDefault();
        const text = t.value.trim();
        if (!text) return;
        col.querySelector(".hello")?.remove();
        col.insertAdjacentHTML("beforeend", `<div class="me">${tok(text)}</div><div class="bot" id="r"><span class="dots"><i></i><i></i><i></i></span></div>`);
        t.value = "";
        const name = (text.match(/\[NAME_\d+\]/) || ["John Smith"])[0];
        setTimeout(() => {
          document.getElementById("r").innerHTML = tok(
            `Here is the short version: ${name} rents the home for $1,850 a month, due on the 1st. The deposit was paid from the account on file.`,
          );
        }, 1600);
      }
      document.getElementById("f").addEventListener("submit", send);
      t.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) send(e); });
    </script>
  </body>
</html>
